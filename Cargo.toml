[package]
name = "valymux"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tower-http.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
valymux-telemetry.workspace = true
envy.workspace = true
reqwest = { workspace = true, features = ["json"] }
valymux-core.workspace = true
valymux-surrealdb.workspace = true
surrealdb-types.workspace = true
uuid.workspace = true
async-stream.workspace = true
bytes.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
dashmap = "6.1.0"
async-trait = "0.1.89"


[workspace]
resolver = "3"
members = ["crates/core", "crates/surrealdb", "crates/telemetry"]

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
tokio = { version = "1.50.0", features = [
    "rt-multi-thread",
    "macros",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
envy = "0.4.2"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
valymux-telemetry = { path = "crates/telemetry" }
valymux-core = { path = "crates/core" }
tower-http = { version = "0.6.8", features = ["trace"] }
thiserror = "2.0.18"
aes-gcm = "0.10.3"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.10.0"
sha2 = "0.10"
surrealdb = "3.0.4"
surrealdb-types = "3.0.4"
valymux-surrealdb = { path = "crates/surrealdb" }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
async-stream = "0.3.6"
bytes = "1.11.1"
futures-util = "0.3.32"
pbkdf2 = "0.12.2"


[profile.release]
opt-level = 3     # Max optimization
lto = "fat"       # Link Time Optimization across all crates
codegen-units = 1 # Slower compile times, but faster execution
panic = "abort"   # Removes stack unwinding overhead
strip = "symbols" # Strips debug symbols to reduce binary size and improve cache locality
